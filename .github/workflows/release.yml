# Push a version tag (git tag v1.2.0 && git push origin v1.2.0) → tests, six builds, checksums, a GitHub Release.
# Uses only GitHub's built-in token; no other secrets. Earlier releases stay.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tags look like v1.2.3 or v1.2.3-beta.1"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
        env:
          MKTAUTO_TOKEN_STORE: file
          MKTAUTO_NO_UPDATE_CHECK: "1"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="mktauto_${VERSION}_${os}_${arch}"
            work="build/$name"; mkdir -p "$work"
            bin="mktauto"; [ "$os" = windows ] && bin="mktauto.exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$work/$bin" ./cmd/mktauto
            cp README.md "$work/"
            if [ "$os" = windows ]; then
              (cd "$work" && zip -q -9 "../../dist/$name.zip" "$bin" README.md)
            else
              tar -C "$work" -czf "dist/$name.tar.gz" "$bin" README.md
            fi
          done
          (cd dist && sha256sum mktauto_* > checksums.txt && cat checksums.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "mktauto ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag "${flags[@]}"
